<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Travel Agent</title>
		<style>
			:root {
				--primary: #0ea5e9;
				--primary-hover: #0284c7;
				--bg: #f8fafc;
				--surface: #fff;
				--border: #e2e8f0;
				--text: #0f172a;
				--text-muted: #64748b;
				--user-bg: #e0f2fe;
				--assistant-bg: #f1f5f9;
			}
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body {
				font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
				line-height: 1.6;
				color: var(--text);
				background: var(--bg);
				min-height: 100vh;
				display: flex;
				flex-direction: column;
			}
			header {
				padding: 1rem 1.5rem;
				background: var(--surface);
				border-bottom: 1px solid var(--border);
				flex-shrink: 0;
			}
			header h1 { font-size: 1.25rem; color: var(--primary); }
			header p { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }
			.note { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem; padding: 0.5rem; background: var(--assistant-bg); border-radius: 6px; }
			.chat-container {
				flex: 1;
				display: flex;
				flex-direction: column;
				max-width: 720px;
				width: 100%;
				margin: 0 auto;
				padding: 1rem;
			}
			.chat-messages {
				flex: 1;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
				padding: 0.5rem 0;
			}
			.message {
				padding: 0.75rem 1rem;
				border-radius: 12px;
				max-width: 85%;
			}
			.message p { white-space: pre-wrap; overflow-wrap: break-word; margin: 0; }
			.user-message { background: var(--user-bg); align-self: flex-end; }
			.assistant-message { background: var(--assistant-bg); align-self: flex-start; }
			.input-row {
				display: flex;
				gap: 0.5rem;
				padding: 0.75rem 0;
				border-top: 1px solid var(--border);
				flex-shrink: 0;
			}
			#user-input {
				flex: 1;
				padding: 0.75rem 1rem;
				border: 1px solid var(--border);
				border-radius: 8px;
				font: inherit;
				resize: none;
				min-height: 44px;
			}
			#send-button {
				padding: 0 1.25rem;
				background: var(--primary);
				color: #fff;
				border: none;
				border-radius: 8px;
				font-weight: 500;
				cursor: pointer;
			}
			#send-button:hover { background: var(--primary-hover); }
			#send-button:disabled { opacity: 0.6; cursor: not-allowed; }
			.typing { font-style: italic; color: var(--text-muted); padding: 0.5rem 0; }
		</style>
		<script src="https://cdn.jsdelivr.net/npm/@cloudflare/realtimekit@1.2.4/dist/browser.js"></script>
	</head>
	<body>
		<header>
			<h1>Travel Agent</h1>
			<p>Single door: UI → Realtime → Gateway Worker → TravelAgent DO (RAG + Amadeus + LLM) → Realtime → UI.</p>
			<p id="realtime-status" class="note">Connecting to Realtime…</p>
		</header>
		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>Hi, I'm your travel agent. Plan trips, flights, hotels, activities. Type a message and send; responses stream via Realtime.</p>
				</div>
			</div>
			<div id="typing" class="typing" style="display: none;">Thinking…</div>
			<div class="input-row">
				<textarea id="user-input" placeholder="e.g. Plan a 3-day trip to Austin under $800, live music and food" rows="1"></textarea>
				<button id="send-button">Send</button>
			</div>
		</div>
		<script>
			const chatMessages = document.getElementById('chat-messages');
			const userInput = document.getElementById('user-input');
			const sendButton = document.getElementById('send-button');
			const typingEl = document.getElementById('typing');
			const statusEl = document.getElementById('realtime-status');
			let isProcessing = false;
			let meeting = null;
			let roomId = sessionStorage.getItem('travel-agent-room') || ('travel-agent-' + Math.random().toString(36).slice(2, 12));
			let userId = sessionStorage.getItem('travel-agent-user') || ('user-' + Math.random().toString(36).slice(2, 9));
			sessionStorage.setItem('travel-agent-room', roomId);
			sessionStorage.setItem('travel-agent-user', userId);

			userInput.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
			});
			sendButton.addEventListener('click', send);

			function appendMessage(role, content) {
				const div = document.createElement('div');
				div.className = 'message ' + role + '-message';
				div.innerHTML = '<p></p>';
				div.querySelector('p').textContent = content;
				chatMessages.appendChild(div);
				chatMessages.scrollTop = chatMessages.scrollHeight;
				return div.querySelector('p');
			}

			async function initRealtime() {
				try {
					const res = await fetch('/api/realtime/token');
					if (!res.ok) {
						const err = await res.json().catch(() => ({}));
						const step = err.step || '';
						const details = err.details != null ? (typeof err.details === 'string' ? err.details : JSON.stringify(err.details)) : err.message || res.statusText;
						if (res.status === 503) {
							statusEl.textContent = 'Realtime token not configured. Send still works; responses stream to Realtime room ' + roomId + '. Set REALTIME_ACCOUNT_ID, REALTIME_APP_ID, CLOUDFLARE_API_TOKEN to connect.';
						} else {
							statusEl.textContent = 'Token error (' + (step || res.status) + '): ' + (details.substring(0, 200) + (details.length > 200 ? '…' : ''));
						}
						return;
					}
					const { meetingId, authToken } = await res.json();
					if (!authToken) { statusEl.textContent = 'No auth token returned.'; return; }
					roomId = meetingId || roomId;
					sessionStorage.setItem('travel-agent-room', roomId);
					if (typeof RealtimeKit === 'undefined') {
						statusEl.textContent = 'RealtimeKit script not loaded. Using send-only mode; roomId=' + roomId;
						return;
					}
					meeting = await RealtimeKit.init({
						authToken: authToken,
						defaults: { audio: false, video: false }
					});
					await meeting.join();
					statusEl.textContent = 'Connected to Realtime room. Messages and responses stream here.';
					if (meeting.chat && meeting.chat.messages) {
						const checkMessages = () => {
							const messages = meeting.chat.messages || [];
							messages.forEach((msg, i) => {
								if (msg._seen) return;
								msg._seen = true;
								const text = (msg.content || msg.text || msg.message || '').trim();
								if (!text) return;
								if (msg.type === 'agent_response' || (msg.userId && String(msg.userId).startsWith('agent'))) {
									const last = chatMessages.querySelector('.assistant-message:last-child p');
									if (last) last.textContent = (last.textContent || '') + text;
									else appendMessage('assistant', text);
									chatMessages.scrollTop = chatMessages.scrollHeight;
								}
							});
						};
						setInterval(checkMessages, 300);
					}
				} catch (e) {
					statusEl.textContent = 'Realtime init failed: ' + (e.message || 'Unknown error') + '. Using send-only; roomId=' + roomId;
				}
			}

			initRealtime();

			async function send() {
				const message = userInput.value.trim();
				if (!message || isProcessing) return;
				isProcessing = true;
				sendButton.disabled = true;
				userInput.value = '';
				appendMessage('user', message);
				typingEl.style.display = 'block';
				chatMessages.scrollTop = chatMessages.scrollHeight;

				const assistantWrap = document.createElement('div');
				assistantWrap.className = 'message assistant-message';
				assistantWrap.innerHTML = '<p></p>';
				chatMessages.appendChild(assistantWrap);
				const assistantP = assistantWrap.querySelector('p');

				try {
					if (meeting && meeting.chat && typeof meeting.chat.sendTextMessage === 'function') {
						await meeting.chat.sendTextMessage(message);
						assistantP.textContent = 'Streaming… (responses appear here from Realtime)';
					} else {
						const res = await fetch('/api/realtime/send', {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({ roomId, userId, text: message }),
						});
						const data = await res.json().catch(() => ({}));
						if (!res.ok) throw new Error(data.message || data.error || 'Send failed');
						assistantP.textContent = 'Message sent. Response is streaming to Realtime room "' + roomId + '". Connect with the same room in Realtime to see it live.';
					}
				} catch (err) {
					assistantP.textContent = 'Error: ' + (err.message || 'Something went wrong');
				} finally {
					typingEl.style.display = 'none';
					sendButton.disabled = false;
					isProcessing = false;
					userInput.focus();
				}
			}
		</script>
	</body>
</html>
